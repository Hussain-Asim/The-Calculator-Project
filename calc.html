<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
    <script src="calc.js" defer></script>
</head>

<body>
    <div class="calculator">

        <div class="display-content">0</div>

        <button class="clear">clear</button>

        <div class="digits">
            <button class="d9">9</button>
            <button class="d8">8</button>
            <button class="d7">7</button>
            <button class="d6">6</button>
            <button class="d5">5</button>
            <button class="d4">4</button>
            <button class="d3">3</button>
            <button class="d2">2</button>
            <button class="d1">1</button>
            <button class="d0">0</button>
        </div>
        <div class="operators">
            <button class="plus">+</button>
            <button class="minus">-</button>
            <button class="multiply">*</button>
            <button class="divide">/</button>
        </div>
        <button>.</button>
        <button>=</button>

    </div>
</body>

</html>
