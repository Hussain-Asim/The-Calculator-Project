<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
    <script src="calc.js" defer></script>
</head>

<body>
    <div class="calculator">

        <div class="display-content">0</div>

        <button class="clear">clear</button>

        <div class="numbers">
            <button class="digits d9">9</button>
            <button class="digits d8">8</button>
            <button class="digits d7">7</button>
            <button class="digits d6">6</button>
            <button class="digits d5">5</button>
            <button class="digits d4">4</button>
            <button class="digits d3">3</button>
            <button class="digits d2">2</button>
            <button class="digits d1">1</button>
            <button class="digits d0">0</button>
        </div>
        <div class="operations">
            <button class="operators plus">+</button>
            <button class="operators minus">-</button>
            <button class="operators mul">*</button>
            <button class="operators division">/</button>
        </div>
        <button>.</button>
        <button>=</button>

    </div>
</body>

</html>
